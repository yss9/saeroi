# frontend 컨테이너 내부 nginx. EC2 앞단 nginx 와 별개다.
# 역할: 정적 파일 서빙 + SPA fallback(새로고침 시 404 방지).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 정적 자산은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
