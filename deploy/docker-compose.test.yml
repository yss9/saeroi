# test 스택 (deploy/feat/test-env, .harness/plans/2026-09-10-ec2-staging-env.md 참고)
#
# 운영(docker-compose.yml, 프로젝트명 circular-fashion)과 완전히 별도 프로젝트로 뜬다.
# 각 파트 <파트>/develop 병합 시 Jenkinsfile 이 이미지를 :test 태그로 빌드하고
# scripts/test-deploy.sh 로 해당 서비스 하나만(--no-deps) 재배포한다 — 실배포(<파트>/master) 직전과
# 동일한 조합(모든 파트의 최신 develop)을 이 스택 하나에서 상시 재현한다.
#
# frontend/backend 만 예외로 운영 nginx 가 붙어 있는 `circular-fashion_web` 네트워크에 추가로
# 조인한다 — nginx 가 `/test/` 요청을 동적 resolver(`resolver 127.0.0.11`)로 cft-frontend /
# cft-backend 를 찾아 라우팅해야 하기 때문이다 (nginx/nginx.conf 참고). mysql/minio 는 운영과
# 절대 같은 네트워크에 두지 않는다 — 이 프로젝트 전용 internal 네트워크로만 통신한다.
#
# 기동/종료: scripts/test-up.sh, scripts/test-down.sh (내부적으로 scripts/compose-test.sh 의
# dc_test() 를 씀 — .env.test 를 명시적으로 읽는다. docker compose 는 기본으로 .env 를 읽는데
# 그건 운영 자격증명이다).
name: circular-fashion-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 서비스 키를 "frontend"/"backend"가 아니라 "test-frontend"/"test-backend"로 둔다.
  # Compose는 네트워크에 조인할 때 서비스 키 자체를 네트워크 별칭으로 자동 등록한다
  # (커스텀 aliases는 추가일 뿐 이 기본 별칭을 없애지 못한다). 운영 compose도 같은
  # circular-fashion_web 네트워크에서 서비스 키 "frontend"/"backend"를 별칭으로 쓰므로,
  # 여기서 같은 키를 쓰면 그 네트워크 안에서 이름이 "backend"인 컨테이너가 둘이 되어
  # nginx가 그 이름을 다시 resolve할 때(재시작/reload) 운영 cf-backend 대신 cft-backend로
  # 붙을 수 있다 — 운영 트래픽이 test로 새는 심각한 문제다. 컨테이너 이름(cft-*)은 그대로라
  # nginx의 /test/ location(container_name 기준)에는 영향이 없다.
  test-frontend:
    image: circular-fashion/frontend:test
    container_name: cft-frontend
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped

  test-backend:
    image: circular-fashion/backend:test
    container_name: cft-backend
    environment:
      # mysql/minio 는 이 서비스 이름 그대로 이 프로젝트 전용 internal 네트워크 안에서만
      # 해석된다 — 운영의 동명 서비스(mysql/minio, cf-mysql/cf-minio)와 네트워크가 분리돼
      # 있어 이름이 같아도 섞이지 않는다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      AI_SERVER_BASE_URL: http://ai:8000
      APP_STORAGE_TYPE: ${STORAGE_TYPE:-local}
      APP_STORAGE_BUCKET: ${STORAGE_BUCKET:-evidence}
      APP_STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-upcycle}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT30M}
      WALLET_NONCE_TTL: ${WALLET_NONCE_TTL:-PT5M}
      # CORS 허용 origin. 운영과 test 가 같은 도메인(j15e104.p.ssafy.io)이라 Origin 헤더에는
      # 경로(/test)가 안 들어가므로 운영과 같은 값을 그대로 쓴다. 2026-09-11 발견 —
      # 이 값이 없으면 브라우저가 same-origin POST 에도 싣는 Origin 헤더가 걸려 로그인이
      # 403 "Invalid CORS request"로 막힌다 (운영도 동일하게 걸려 있었다, 같이 수정).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # 키가 없으면 좌표 없는 업체가 저장되지 않도록 backend 가 사업자 회원가입·주소 변경
      # 자체를 의도적으로 거절한다 (KakaoGeocodingProperties.isConfigured(), 2026-09-11
      # 발견). 운영과 같은 값을 재사용한다 — 카카오 키는 도메인이 아니라 앱 단위라 test용을
      # 따로 받을 필요 없다.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_GEOCODING_BASE_URL: ${KAKAO_GEOCODING_BASE_URL:-https://dapi.kakao.com}
      # secret-key 가 없으면 MockPaymentGateway 로 대체될 뿐 기동은 막지 않는다(Geocoding
      # 과 다름). test 는 **운영과 다른(DEV/샌드박스) 키를 쓴다** — 실제 청구가 나가는
      # 운영 키를 test 환경에 두지 않는다. return-url 들은 /test 프리픽스가 필요하다
      # (frontend basename 과 맞춰야 결제 완료 후 돌아올 때 라우팅이 깨지지 않는다).
      KAKAOPAY_SECRET_KEY: ${KAKAOPAY_SECRET_KEY:-}
      KAKAOPAY_CID: ${KAKAOPAY_CID:-TC0ONETIME}
      KAKAOPAY_RETURN_URL: ${KAKAOPAY_RETURN_URL:-https://j15e104.p.ssafy.io/test/trades/{tradeId}/payment/return}
      KAKAOPAY_PROCESSING_RETURN_URL: ${KAKAOPAY_PROCESSING_RETURN_URL:-https://j15e104.p.ssafy.io/test/processing/jobs/{jobId}/payment/callback}
      # backend/develop 에서 새로 필수화된 값 (QR 이 제품에 인쇄되므로 빈 값이면 ProductQrConfig
      # 가 기동 자체를 막는다). `:-` 기본값을 쓴다 — `:?`는 MINIO_ROOT_PASSWORD 와 같은 이유로
      # 안 쓴다: 파일 전체가 매 호출마다 보간되므로 무관한 서비스 배포(`up --no-deps frontend`)
      # 까지 이 값 하나 때문에 전부 실패하게 된다. 값이 비면 backend 스스로 명확히 실패한다.
      # 운영 .env.example 에는 아직 없다 — backend/master 가 이 기능을 받을 때 그쪽에도 추가할 것.
      QR_BASE_URL: ${QR_BASE_URL:-}
      # 운영과 같은 테스트넷/컨트랙트를 재사용한다 — .env.test 에도 운영 .env 와 동일한
      # 값을 채워 넣는다 (배경: .harness/plans/2026-09-10-ec2-staging-env.md §0).
      BESU_RPC_URL: ${BESU_RPC_URL:-}
      BESU_CHAIN_ID: ${BESU_CHAIN_ID:-}
      BLOCKCHAIN_SERVICE_PRIVATE_KEY: ${BLOCKCHAIN_SERVICE_PRIVATE_KEY:-}
      MATERIAL_TOKEN_ADDRESS: ${MATERIAL_TOKEN_ADDRESS:-}
      PAYMENT_TOKEN_ADDRESS: ${PAYMENT_TOKEN_ADDRESS:-}
      ESCROW_ADDRESS: ${ESCROW_ADDRESS:-}
    volumes:
      - test-file-storage:/app/files
    depends_on:
      mysql:
        condition: service_healthy
      # minio 는 운영과 같은 이유로 넣지 않는다 (docker-compose.yml 의 backend.depends_on 주석 참고)
    networks:
      - web
      - internal
    logging: *default-logging
    restart: unless-stopped

  ai:
    image: circular-fashion/ai:test
    container_name: cft-ai
    environment:
      AI_MODEL_PATH: ${AI_MODEL_PATH:-}
    networks:
      - internal
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: cft-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: server /data --console-address ":9001"
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging: *default-logging
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: cft-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-evidence}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set cf http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "cf/$$STORAGE_BUCKET"
        echo "bucket ready: $$STORAGE_BUCKET"
    networks:
      - internal
    logging: *default-logging
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: cft-mysql
    # 호스트 포트를 열지 않는다 — 운영 mysql 이 이미 127.0.0.1:3306 을 쓰고 있고,
    # test DB 는 내부에서만 쓰면 충분하다.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - test-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging
    restart: unless-stopped

networks:
  # 운영 nginx 가 붙어 있는 네트워크. 운영 docker-compose.yml 의 `name: circular-fashion` +
  # `networks: web:` 이 실제로 만드는 네트워크 이름이 "circular-fashion_web" 이다.
  # 운영 스택이 먼저 떠 있어야 이 네트워크가 존재한다 — 없으면 test-up.sh 가 이 지점에서 실패한다.
  web:
    external: true
    name: circular-fashion_web
  # 이 프로젝트(circular-fashion-test) 전용. 운영 internal 네트워크와 분리돼 있어
  # mysql/minio 가 이름이 같아도 섞이지 않는다.
  internal:

volumes:
  test-mysql-data:
  test-minio-data:
  test-file-storage:
