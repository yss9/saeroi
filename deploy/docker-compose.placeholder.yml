# EC2 전용 override — "아직 실제 이미지가 없는 서비스"만 placeholder 로 대체한다.
# scripts/compose.sh 가 이 파일의 존재를 자동 감지해 -f 로 합성하므로,
# 배포 스크립트를 통해 실행하는 한 override 를 빠뜨릴 일이 없다.
#
# 졸업 절차 (파트별로 시점이 다르다):
#   1. 해당 파트의 첫 이미지 빌드가 성공하면
#   2. 아래에서 그 서비스 블록만 삭제하고 커밋 → MR → EC2 에서 git pull
#   3. 파이프라인 재실행
# 서비스 블록이 모두 사라지면 mysql 블록만 docker-compose.yml 본체로 옮기고 이 파일을 삭제한다.
#
# 졸업을 잊으면 deploy-<part>.sh 가 "아직 placeholder 로 실행 중"이라며 안내와 함께 실패한다.
#
# 로컬 검증용 override 는 docker-compose.local.yml 이다 (이 파일과 별개 — 수명주기가 다르다).
services:
  # [졸업 예정: backend 첫 배포 시 이 블록 삭제]
  backend:
    image: traefik/whoami
    command:
      - --port=8080
      - --name=backend-placeholder

  # [졸업 예정: frontend 첫 배포 시 이 블록 삭제]
  frontend:
    image: nginxdemos/hello:plain-text

  # [졸업 예정: ai 첫 배포 시 이 블록 삭제 — 한참 뒤]
  ai:
    image: traefik/whoami
    command:
      - --port=8000
      - --name=ai-placeholder

  # placeholder 가 아니라 EC2 고유 설정. 마지막 정리 때 docker-compose.yml 본체로 옮길 것.
  # Docker publish 포트는 UFW 를 우회하므로 루프백 바인딩으로 외부 노출을 막는다.
  mysql:
    ports:
      - "127.0.0.1:3306:3306"
