# Circular-Fashion 운영 구성 (AWS EC2 1대 기준)
# - 외부 진입점은 nginx(80/443)와 jenkins(8081)뿐이며, 나머지는 내부 네트워크로만 통신한다.
# - frontend/backend/ai 이미지는 각 파트 master 브랜치의 Dockerfile로 빌드된다. (이미지 이름 규약 고정)
# - 실행 전 .env 파일이 필요하다: cp .env.example .env 후 실값 입력
name: circular-fashion

# 컨테이너 로그 로테이션 — 디스크 가득참 사고 예방 (서비스별 최대 30MB)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot webroot (HTTPS 인증서 발급/갱신용) — nginx.conf의 acme-challenge location과 짝
      - ./certbot/www:/var/www/certbot:ro
      # Let's Encrypt 인증서 — certbot 기본 경로를 그대로 마운트 (systemd 자동 갱신과 호환)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped

  frontend:
    image: circular-fashion/frontend:latest
    container_name: cf-frontend
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped

  backend:
    image: circular-fashion/backend:latest
    container_name: cf-backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      AI_SERVER_BASE_URL: http://ai:8000
    volumes:
      - file-storage:/app/files
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web
      - internal
    logging: *default-logging
    restart: unless-stopped

  ai:
    image: circular-fashion/ai:latest
    container_name: cf-ai
    env_file: .env
    networks:
      - internal
    logging: *default-logging
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: cf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    image: circular-fashion/jenkins:latest
    container_name: cf-jenkins
    ports:
      - "8081:8080"
    environment:
      # JCasC(jenkins/casc.yaml)에서 사용 — EC2에서는 .env에 실값 필수
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JENKINS_EXTERNAL_URL: ${JENKINS_EXTERNAL_URL:-http://localhost:8081/}
      GITLAB_USERNAME: ${GITLAB_USERNAME:-oauth2}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-changeme}
    volumes:
      - jenkins-home:/var/jenkins_home
      # 호스트 Docker로 이미지 빌드/배포를 수행하기 위한 소켓 공유
      - /var/run/docker.sock:/var/run/docker.sock
      # 배포 스크립트 / compose 파일 / .env 접근용.
      # 반드시 호스트와 "동일한 절대경로"에 마운트할 것 — compose는 ./nginx 같은 상대 bind 경로를
      # 호스트 절대경로로 변환해 데몬에 넘기므로, 다른 경로에 걸면 nginx가 빈 파일을 마운트한 채 뜬다.
      - /home/ubuntu/deploy:/home/ubuntu/deploy:ro
      # casc.yaml을 이미지 재빌드 없이 반영 (Manage Jenkins → CasC → Reload 로 즉시 적용 가능)
      - ./jenkins/casc.yaml:/var/jenkins_casc/casc.yaml:ro
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped

networks:
  web:
  internal:

volumes:
  mysql-data:
  jenkins-home:
  file-storage:
