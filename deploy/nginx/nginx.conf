# /etc/nginx/conf.d/default.conf 로 마운트됨 (docker-compose.yml 참고)
# 역할: 유일한 외부 진입점. `/` → frontend, `/api` → backend 리버스 프록시.
# SPA fallback(react-router)은 frontend 이미지 내부 nginx가 처리한다.
# HTTPS: 80은 acme-challenge + 301 리다이렉트만, 서비스는 443에서 처리.

# ── 인증 엔드포인트 rate limit ───────────────────────────
# POST /api/v1/auth/wallet/nonce 는 "이 지갑 주소가 우리 서비스에 등록돼 있는가" 를
# 그대로 알려주는 오라클이다 — 미등록 주소면 WALLET_NOT_LINKED 로 즉시 거절한다.
# 인증이 필요 없는 엔드포인트라(SecurityConfig 가 /api/v1/auth/** 를 열어둔다)
# 아무나 주소 목록을 넣고 돌리면 우리 사용자 지갑을 추려낼 수 있다.
# /verify 도 서명 대입 시도를 반복할 수 있어 같은 구역에 묶는다.
#
# 애플리케이션이 아니라 여기서 막는 이유: 백엔드까지 가면 이미 DB 조회 한 번이 나간다.
# 10m 은 약 16만 IP 를 담는다. rate 는 분당이라 내부적으로 6초에 1건으로 환산되고,
# burst=20 은 정상 사용자가 팝업 취소 후 몇 번 다시 시도하는 정도를 흡수한다.
# nodelay 는 burst 안의 요청을 지연 없이 즉시 통과시킨다 — 큐잉으로 응답이 느려지면
# 사용자는 장애로 인식하고 더 눌러서 상황을 악화시킨다.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# 기본 503 대신 429. 프론트가 "잠시 후 다시" 와 "서버 장애" 를 구분해야 한다.
limit_req_status 429;
limit_req_log_level warn;

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:8080;
}

upstream jenkins {
    server jenkins:8080;
}

server {
    listen 80;
    server_name _;

    # certbot webroot 방식 인증서 발급/갱신 — nginx 중단 없이 가능
    # EC2에서: sudo certbot certonly --webroot -w ~/deploy/certbot/www -d j15e104.p.ssafy.io
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name j15e104.p.ssafy.io;

    # 호스트 /etc/letsencrypt 마운트 (docker-compose.yml) — certbot 기본 경로라 systemd 자동 갱신과 호환
    ssl_certificate     /etc/letsencrypt/live/j15e104.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15e104.p.ssafy.io/privkey.pem;

    # 증빙 이미지/문서 업로드 대비
    client_max_body_size 20m;

    # 응답 압축
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 프록시 버퍼
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;

    # 보안 헤더
    # HSTS: 80→443 을 301 로 이미 강제하므로 브라우저가 다음부터는 http 시도 자체를 생략하게 한다.
    # includeSubDomains 는 넣지 않는다 — p.ssafy.io 는 공유 도메인이라 우리 통제 밖이다.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /api/ 보다 긴 프리픽스라 nginx 가 이쪽을 먼저 고른다. proxy 설정은 아래 /api/ 와
    # 같아야 한다 — location 은 상속되지 않으므로 한쪽만 고치면 조용히 어긋난다.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;

        # 429 응답 본문을 백엔드의 ApiResponse 봉투와 같은 모양으로 맞춘다. 기본 nginx
        # HTML 이 돌아가면 프론트의 JSON 파싱이 깨져 원인 모를 에러로 보인다.
        # timestamp 는 nginx 의 $time_iso8601 이라 오프셋이 붙는다(백엔드는 LocalDateTime).
        # 형식이 다른 건 의도적이다 — 이 응답은 애플리케이션까지 가지 않았다는 뜻이다.
        error_page 429 = @auth_rate_limited;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @auth_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"code":"TOO_MANY_REQUESTS","message":"요청이 너무 잦습니다. 잠시 후 다시 시도해 주세요.","data":null,"timestamp":"$time_iso8601"}';
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── /test/ — 상시 통합 테스트 스택 (deploy/feat/test-env, cft-* 컨테이너) ──────────
    # 각 파트 <파트>/develop 병합마다 scripts/test-deploy.sh 가 이 스택의 해당 서비스만
    # 재배포한다. 정적 upstream{} 을 쓰면 test 스택이 내려간 상태에서 nginx 자체가
    # "host not found in upstream" 으로 기동/reload 에 실패한다 — 반드시 resolver + 변수
    # 방식을 써서, test 컨테이너 유무와 무관하게 nginx 는 항상 살아 있게 한다.
    # 127.0.0.11 은 Docker 임베디드 DNS 다. valid=10s 는 컨테이너 재기동으로 IP 가 바뀌어도
    # 오래된 응답을 오래 붙들지 않기 위함이다.
    resolver 127.0.0.11 valid=10s;

    # /test/api/ 가 /test/ 보다 먼저 매치돼야 하므로 위에 둔다 (longest-prefix 매칭이라
    # 순서 자체는 무관하지만, /api/v1/auth/ · /api/ 순서와 같은 관례를 따른다).
    #
    # rewrite 는 `/test` 프리픽스만 벗긴다 — `/api/`는 backend 의 실제 경로이므로 남겨야
    # 한다. `/test/api/health` → `/api/health` (O), `/health` (X, 다른 — 인증 필요한 — 경로라
    # 401 이 난다. EC2 실측에서 실제로 이 실수를 했다가 잡았다).
    location /test/api/ {
        set $test_backend cft-backend;
        rewrite ^/test/(.*)$ /$1 break;
        proxy_pass http://$test_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 프론트 정적 자산. Vite `base=/test/` 로 빌드돼 HTML/JS 가 `/test/...` 를 참조하므로,
    # 여기서 프리픽스를 벗겨 컨테이너 내부 실제 경로(예: /assets/x.js)로 맞춰 전달한다.
    location /test/ {
        set $test_frontend cft-frontend;
        rewrite ^/test/(.*)$ /$1 break;
        proxy_pass http://$test_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Jenkins. 예전에는 8081 을 인터넷 전체에 평문 http 로 열어뒀는데, Jenkins 는
    # docker.sock 을 물고 있어 탈취당하면 호스트 전체를 잃는다. 그런 관문의 로그인 비밀번호가
    # 평문으로 흐르고 있었다. 이제 8081 은 루프백에만 바인딩하고 외부 접근은 여기로만 받는다.
    # Jenkins 쪽도 --prefix=/jenkins 로 떠야 링크가 깨지지 않는다 (docker-compose.yml 참고).
    location /jenkins/ {
        proxy_pass http://jenkins;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # 빌드 콘솔 로그는 오래 열려 있는 스트림이다. 버퍼링을 켜두면 로그가 뭉텅이로 늦게 나온다.
        proxy_buffering     off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # 플러그인 업로드(.hpi) 대비 — 기본 20m 로는 모자란다
        client_max_body_size 100m;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
