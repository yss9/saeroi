# /etc/nginx/conf.d/default.conf 로 마운트됨 (docker-compose.yml 참고)
# 역할: 유일한 외부 진입점. `/` → frontend, `/api` → backend 리버스 프록시.
# SPA fallback(react-router)은 frontend 이미지 내부 nginx가 처리한다.

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # 증빙 이미지/문서 업로드 대비
    client_max_body_size 20m;

    # 응답 압축
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 프록시 버퍼
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;

    # 보안 헤더 (README 12장 운영 주의사항)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # certbot webroot 방식 인증서 발급/갱신 — nginx 중단 없이 가능
    # EC2에서: certbot certonly --webroot -w <deploy경로>/certbot/www -d <TEAM_DOMAIN>.p.ssafy.io
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS 템플릿 ─────────────────────────────────────────
# EC2에서 SSAFY 제공 도메인(*.p.ssafy.io) 확인 후 위 webroot 방식으로 인증서 발급하고,
# docker-compose.yml의 ./certbot/conf:/etc/letsencrypt:ro 마운트 주석 해제 후 이 블록 활성화.
# 발급 후 위 80 서버 블록의 location들은 `return 301 https://$host$request_uri;` 리다이렉트로 변경
# (acme-challenge location은 80에 유지).
