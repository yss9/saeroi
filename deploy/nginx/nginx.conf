# /etc/nginx/conf.d/default.conf 로 마운트됨 (docker-compose.yml 참고)
# 역할: 유일한 외부 진입점. `/` → frontend, `/api` → backend 리버스 프록시.
# SPA fallback(react-router)은 frontend 이미지 내부 nginx가 처리한다.
# HTTPS: 80은 acme-challenge + 301 리다이렉트만, 서비스는 443에서 처리.

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # certbot webroot 방식 인증서 발급/갱신 — nginx 중단 없이 가능
    # EC2에서: sudo certbot certonly --webroot -w ~/deploy/certbot/www -d j15e104.p.ssafy.io
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name j15e104.p.ssafy.io;

    # 호스트 /etc/letsencrypt 마운트 (docker-compose.yml) — certbot 기본 경로라 systemd 자동 갱신과 호환
    ssl_certificate     /etc/letsencrypt/live/j15e104.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15e104.p.ssafy.io/privkey.pem;

    # 증빙 이미지/문서 업로드 대비
    client_max_body_size 20m;

    # 응답 압축
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 프록시 버퍼
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;

    # 보안 헤더 (README 12장 운영 주의사항)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
