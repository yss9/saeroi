# /etc/nginx/conf.d/default.conf 로 마운트됨 (docker-compose.yml 참고)
# 역할: 유일한 외부 진입점. `/` → frontend, `/api` → backend 리버스 프록시.
# SPA fallback(react-router)은 frontend 이미지 내부 nginx가 처리한다.
# HTTPS: 80은 acme-challenge + 301 리다이렉트만, 서비스는 443에서 처리.

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:8080;
}

upstream jenkins {
    server jenkins:8080;
}

server {
    listen 80;
    server_name _;

    # certbot webroot 방식 인증서 발급/갱신 — nginx 중단 없이 가능
    # EC2에서: sudo certbot certonly --webroot -w ~/deploy/certbot/www -d j15e104.p.ssafy.io
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name j15e104.p.ssafy.io;

    # 호스트 /etc/letsencrypt 마운트 (docker-compose.yml) — certbot 기본 경로라 systemd 자동 갱신과 호환
    ssl_certificate     /etc/letsencrypt/live/j15e104.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15e104.p.ssafy.io/privkey.pem;

    # 증빙 이미지/문서 업로드 대비
    client_max_body_size 20m;

    # 응답 압축
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 프록시 버퍼
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;

    # 보안 헤더
    # HSTS: 80→443 을 301 로 이미 강제하므로 브라우저가 다음부터는 http 시도 자체를 생략하게 한다.
    # includeSubDomains 는 넣지 않는다 — p.ssafy.io 는 공유 도메인이라 우리 통제 밖이다.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Jenkins. 예전에는 8081 을 인터넷 전체에 평문 http 로 열어뒀는데, Jenkins 는
    # docker.sock 을 물고 있어 탈취당하면 호스트 전체를 잃는다. 그런 관문의 로그인 비밀번호가
    # 평문으로 흐르고 있었다. 이제 8081 은 루프백에만 바인딩하고 외부 접근은 여기로만 받는다.
    # Jenkins 쪽도 --prefix=/jenkins 로 떠야 링크가 깨지지 않는다 (docker-compose.yml 참고).
    location /jenkins/ {
        proxy_pass http://jenkins;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # 빌드 콘솔 로그는 오래 열려 있는 스트림이다. 버퍼링을 켜두면 로그가 뭉텅이로 늦게 나온다.
        proxy_buffering     off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # 플러그인 업로드(.hpi) 대비 — 기본 20m 로는 모자란다
        client_max_body_size 100m;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
