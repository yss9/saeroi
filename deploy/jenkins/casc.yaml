# Jenkins Configuration as Code (JCasC)
# - Jenkins 기동 시 자동 적용된다. 웹 화면에서의 초기 세팅(계정/플러그인/Job 등록)이 필요 없다.
# - ${VAR} 값은 컨테이너 환경변수(.env → docker-compose.yml)에서 주입된다.
# - 주의: EC2에서는 .env에 JENKINS_ADMIN_PASSWORD를 반드시 설정할 것 (기본값 admin은 로컬 검증용)
jenkins:
  systemMessage: "Circular-Fashion CI — 이 설정은 deploy/master의 jenkins/casc.yaml(JCasC)로 관리됩니다"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_EXTERNAL_URL:-http://localhost:8081/jenkins/}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "gitlab-token"
              username: "${GITLAB_USERNAME:-oauth2}"
              password: "${GITLAB_TOKEN:-changeme}"
              description: "GitLab Access Token (리포 clone용)"

# Multibranch Pipeline — 파트당 Job 1개.
# 파이프라인 정의는 이 파일이 아니라 "각 파트 브랜치 루트의 Jenkinsfile"이다.
# Jenkinsfile이 없는 브랜치는 Job이 생성되지 않는다 (실패가 아니라 미생성).
jobs:
  - script: |
      def repo = 'https://lab.ssafy.com/s15-blockchain-pred-sub1/S15P21E104.git'

      // includes: 발견할 브랜치 (공백 구분). 여기 매칭되지 않는 ref는 인덱싱 단계에서 버려진다
      //           — 체크아웃도, Jenkinsfile 읽기도 일어나지 않는다.
      //           따라서 deploy/master, master, 타 파트 브랜치는 어느 Job에도 잡히지 않는다.
      // 접두어를 전부 나열한 이유: '*'가 슬래시를 넘어 매칭되는지가 플러그인 버전마다 다를 수 있고,
      //                        GIT_CONVENTION.md의 브랜치 규약을 여기에 그대로 문서화하기 위함.
      // 대시보드에 보이는 이름은 파트명을 대문자로 쓴 것뿐이다 (AI / BACKEND / BLOCKCHAIN / FRONTEND).
      // 역할 설명은 이름이 아니라 아래 role — 즉 Job description 으로 넘긴다.
      // Job 의 내부 id(=폴더명/URL)는 첫 항목인 part 그대로다 — 바꾸면 빌드 이력이 초기화된다.
      [
        [part: 'backend',
         role:  '운영 도메인의 /api/* 를 처리하는 Spring 서버 이미지(circular-fashion/backend)를 빌드/배포한다.',
         includes: 'backend/master backend/develop backend/feat/* backend/fix/* backend/refactor/*'],

        [part: 'frontend',
         role:  '운영 도메인의 / 를 서비스하는 정적 SPA 이미지(circular-fashion/frontend)를 빌드/배포한다.',
         includes: 'frontend/master frontend/develop frontend/feat/* frontend/fix/* frontend/refactor/*'],

        [part: 'ai',
         role:  '외부에 노출되지 않는 내부 서비스 이미지(circular-fashion/ai)를 빌드/배포한다. backend 가 내부 네트워크로만 호출한다.',
         includes: 'ai/master ai/develop ai/feat/* ai/fix/* ai/refactor/*'],

        // blockchain은 배포가 없다. master의 Besu 배포는 수동 승인 후 담당자가 직접 수행하는
        // 팀 규칙(README 12장)이라 develop 계열만 CI 대상으로 둔다.
        [part: 'blockchain',
         role:  '컨트랙트 컴파일/테스트만 수행한다. Besu 배포는 이 Job이 하지 않는다 — 담당자가 수동 승인 후 직접 실행한다.',
         includes: 'blockchain/develop blockchain/feat/* blockchain/fix/* blockchain/refactor/*'],
      ].each { p ->
        multibranchPipelineJob(p.part) {
          displayName(p.part.toUpperCase())
          description([
            // 대시보드 Description 열에는 사실상 첫 줄만 보인다. 그래서 첫 줄을 역할 설명으로 둔다.
            p.role,
            "",
            "발견 대상 브랜치: ${p.includes}",
            "파이프라인 정의는 각 브랜치 루트의 Jenkinsfile 이다 (deploy/master 가 아님).",
            "CI(테스트)는 develop/feat 브랜치에서, CD(이미지 빌드+배포)는 ${p.part}/master 에서만 실행된다.",
            "이 Job 설정은 deploy/master 의 jenkins/casc.yaml 로 관리된다 — UI 수정은 재기동 시 덮어써진다.",
          ].join('\n'))

          branchSources {
            git {
              id("${p.part}-src")          // 고유해야 함. 바꾸면 브랜치별 빌드 이력이 초기화된다.
              remote(repo)
              credentialsId('gitlab-token')
              includes(p.includes)
              excludes('')
            }
          }

          factory {
            workflowBranchProjectFactory {
              scriptPath('Jenkinsfile')    // 각 파트 브랜치 루트
            }
          }

          // 삭제된 브랜치의 Job과 빌드 이력을 회수한다. feat 브랜치가 쌓여 디스크를 먹는 것을 방지.
          // 대상은 "원격에서 사라진 브랜치"의 Job 뿐이다 — 살아 있는 브랜치는 아무리 오래돼도
          // 여기서 지워지지 않는다 (지워도 다음 인덱싱에서 되살아난다).
          // daysToKeep: MR 병합 후 브랜치를 지우면 그 Job 을 2일만 남긴다. 7일은 너무 길어
          // feat 브랜치 회전이 빠른 지금은 대시보드가 죽은 Job 으로 덮인다 (2026-09-07 변경).
          orphanedItemStrategy {
            discardOldItems {
              numToKeep(10)
              daysToKeep(2)
            }
          }

          // webhook이 유실되거나 막혀도 최대 5분 뒤에는 잡힌다 (webhook은 즉시성, 이건 안전망).
          triggers {
            periodicFolderTrigger {
              interval('5m')
            }
          }
        }
      }
