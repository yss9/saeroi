# Docker Compose 로컬 실행용 프론트 nginx.
# 브라우저에는 하나의 origin(:5173)만 노출하고 /api 요청은 내부 backend 서비스로 넘긴다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Docker 내장 DNS. **이 줄이 없으면 nginx 는 backend 의 IP 를 기동 시점에 한 번만
    # 풀고 그대로 굳힌다.** 컨테이너를 새로 만들어 IP 가 바뀌면(서비스를 하나 추가하는
    # 것만으로도 재배치된다) 옛 주소로 계속 보내고, 그 주소를 다른 컨테이너가 차지하면
    # 모든 /api 가 502 로 죽는다 — 화면에는 "요청을 처리하지 못했습니다" 만 뜬다.
    #
    # proxy_pass 에 변수를 쓰면 요청마다 다시 푼다. valid 로 캐시 수명을 짧게 둔다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 브라우저에는 같은 origin(:5173) 요청이다. 내부 backend가 LAN IP를
        # 별도 CORS origin으로 다시 검사하지 않도록 프록시 경계에서 제거한다.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
