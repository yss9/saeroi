name: upcycle-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-upcycle}
      MYSQL_USER: ${MYSQL_USER:-upcycle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-upcyclepassword}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-upcycle}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ${MYSQL_USER:-upcycle}
      DB_PASSWORD: ${MYSQL_PASSWORD:-upcyclepassword}
      JWT_SECRET: ${JWT_SECRET:-dXBjeWNsZS1sb2NhbC1jb21wb3NlLWp3dC1zZWNyZXQtMjAyNg==}
      JWT_ISSUER: ${JWT_ISSUER:-upcycle-local}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT30M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P14D}
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-Strict}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      KAKAOPAY_SECRET_KEY: ${KAKAOPAY_SECRET_KEY:-}
      KAKAOPAY_CID: ${KAKAOPAY_CID:-TC0ONETIME}
      KAKAOPAY_RETURN_URL: ${KAKAOPAY_RETURN_URL:-http://localhost:5173/trades/{tradeId}/payment/return}
      KAKAOPAY_PROCESSING_RETURN_URL: ${KAKAOPAY_PROCESSING_RETURN_URL:-http://localhost:5173/processing/jobs/{jobId}/payment/callback}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      COMPANY_GEOLOCATION_BACKFILL_ENABLED: ${COMPANY_GEOLOCATION_BACKFILL_ENABLED:-false}
      QR_BASE_URL: ${QR_BASE_URL:-http://localhost:5173/qr}
      BESU_CHAIN_ID: ${BESU_CHAIN_ID:-31221}
      MATERIAL_TOKEN_ADDRESS: ${MATERIAL_TOKEN_ADDRESS:-}
      MARKETPLACE_ADDRESS: ${MARKETPLACE_ADDRESS:-}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    volumes:
      - file-storage:/app/files
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../S15P21E104_front
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_BESU_RPC_URL: ${VITE_BESU_RPC_URL:-}
        VITE_BESU_CHAIN_ID: ${VITE_BESU_CHAIN_ID:-31221}
        VITE_BESU_EXPLORER_URL: ${VITE_BESU_EXPLORER_URL:-}
        VITE_MATERIAL_CONTRACT_ADDRESS: ${VITE_MATERIAL_CONTRACT_ADDRESS:-}
        VITE_MARKETPLACE_CONTRACT_ADDRESS: ${VITE_MARKETPLACE_CONTRACT_ADDRESS:-}
        VITE_PROCESSING_CONTRACT_ADDRESS: ${VITE_PROCESSING_CONTRACT_ADDRESS:-}
        VITE_PRODUCTION_CONTRACT_ADDRESS: ${VITE_PRODUCTION_CONTRACT_ADDRESS:-}
    ports:
      - "5173:80"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  file-storage:
