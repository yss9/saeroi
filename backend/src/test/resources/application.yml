spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:upcycle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
app:
  security:
    jwt:
      secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      issuer: upcycle-test
      access-token-ttl: PT30M
