spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:upcycle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      # create-drop 이 아니라 create 다. 두 값의 차이는 "컨텍스트가 닫힐 때 테이블을
      # 지우는가" 하나뿐인데, 그 드롭이 이 스위트에서는 사고를 만든다.
      #
      # 테스트 전체가 이름이 같은 in-memory H2 하나를 공유하고, @TestPropertySource 나
      # @Import 로 설정이 다른 클래스마다 스프링 컨텍스트가 따로 만들어진다. 컨텍스트
      # 캐시가 상한을 넘으면 오래된 것이 닫히는데, create-drop 은 그때 스키마를 통째로
      # 지운다 — 그러면 캐시에 남아 있던 다른 컨텍스트가 다음 테스트에서
      # "Table not found" 로 깨진다. 실제로 그렇게 WalletAuthServiceTests 23건이 한꺼번에
      # 무너졌고, 원인이 그 클래스와 아무 상관이 없어 찾기 어려웠다.
      #
      # create 는 시작할 때만 지우고 만든다. 각 컨텍스트는 자기 테스트 전에 시작하므로
      # 테이블이 없는 상태를 만나지 않는다. 데이터는 클래스마다 @BeforeEach 가 채운다.
      ddl-auto: create
app:
  # ── 스케줄러를 사실상 멈춘다 ──────────────────────────────────────────
  #
  # 만료 워커와 블록 폴러가 테스트 중에 돌면 @MockitoBean 리포지토리를 건드린다. 그 호출이
  # `when(...)` 스터빙 중간에 끼어들면 Mockito 가 엉뚱한 메시지로 터진다 —
  # "Optional cannot be returned by findExpiredUnpaid()" 가 실제로 그랬고, 정작 그 테스트는
  # findExpiredUnpaid 를 쓰지도 않아 원인을 찾기 어려웠다.
  #
  # 단독 실행에서는 통과하고 전체 실행에서만 깨지는 모양이라 플레이키로 보인다. 실행이
  # 길어질수록 워커가 끼어들 기회가 늘기 때문이다. 블록 폴러(2.5초)가 들어온 뒤 확률이
  # 눈에 띄게 올라갔다.
  #
  # 끄는 대신 주기를 길게 둔다. @EnableScheduling 이 도메인 설정 클래스마다 붙어 있어 한
  # 곳에서 끌 수 없고, 주기만 늘리면 워커 자체의 동작은 그대로 시험할 수 있다.
  trade:
    payment-expiry:
      interval-ms: 3600000
  processing:
    expiry:
      interval-ms: 3600000
  product:
    order-expiry:
      interval-ms: 3600000
  prediction:
    oracle-delay-ms: 3600000
  blockchain:
    live-initial-delay-ms: 3600000
    live-poll-ms: 3600000
    reconciliation-initial-delay-ms: 3600000
    reconciliation-poll-ms: 3600000
  company-role-approval-guard:
    # 기존 도메인 테스트는 각 기능의 자체 권한 검사를 독립적으로 검증한다.
    # 전역 승인 차단은 CompanyRoleApprovalGuardTests에서만 다시 켜서 검증한다.
    enabled: false
  qr:
    # 기동 필수값이라 테스트에도 넣는다. 실제 프론트 주소일 필요는 없다 —
    # 여기서 보는 것은 조립 규칙이지 그 주소가 열리는지가 아니다.
    base-url: https://upcycle.test/qr
  security:
    jwt:
      secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      issuer: upcycle-test
      access-token-ttl: PT30M
  auth:
    refresh-token:
      ttl: P14D
      cookie-secure: true
      cookie-same-site: Strict
    wallet:
      nonce-ttl: PT5M
  agent:
    # 실제 GMS 를 부르지 않는다 — 테스트는 LlmClient 를 스텁으로 갈아끼운다. 여기 값이
    # 필요한 이유는 키가 비면 AgentConfig 가 UnavailableLlmClient 를 등록해 버려서,
    # 스텁을 넣지 않은 테스트가 503 이 아니라 "설정 안 됨"으로 실패하기 때문이다.
    base-url: http://llm.test/v1
    api-key: test-key
    model: test-model
    # 루프 상한 테스트가 이 값을 기준으로 삼는다. 작게 두어야 테스트가 빠르다.
    max-tool-iterations: 3
    action-ttl: PT1H
