# 공통 설정. 비밀값은 여기에 적지 않고 ${...} 로 외부에서 받는다.
#
# 로컬에서 값을 넣는 방법 두 가지 — 둘 다 동작하고, 환경변수가 우선한다.
#
#   1) application-local.yml (권장)
#      application-local.yml.example 를 복사해 값을 채우고
#      ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#      그 파일은 .gitignore 에 들어 있다.
#
#   2) 환경변수
#      DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET / KAKAOPAY_SECRET_KEY ...
#
spring:
  servlet:
    multipart:
      # ⚠️ 기본값은 파일 1MB · 요청 10MB 다. 그대로 두면 휴대폰 사진(3~8MB)이
      #    우리 검증에 닿기도 전에 MaxUploadSizeExceededException 으로 거절된다.
      #
      # max-file-size 는 정책의 파일당 상한(10MB)과 같게 둔다. 앞 층에서 먼저 걸리면
      # GlobalExceptionHandler 가 FILE_TOO_LARGE 로 번역해 사용자가 읽을 수 있게 한다.
      max-file-size: 10MB
      #
      # max-request-size 는 nginx client_max_body_size(20m)에 맞춘다.
      # 파일당 10MB × 10개 = 100MB 를 그대로 열어 두면 nginx 가 413 을 내는데
      # 그건 사용자에게 빈 페이지로 보인다 — 우리 층에서 읽을 수 있는 오류를 만드는 것이
      # 두 층 방어의 목적이므로, 실제로 통과 가능한 값에 맞춘다.
      max-request-size: 20MB
  application:
    name: upcycle
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/upcycle}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
app:
  demo-catalog:
    # 시연 환경에서만 명시적으로 켠다. 기본값 false라 운영·일반 개발 DB에는
    # 시연 브랜드와 상품이 자동으로 들어가지 않는다.
    enabled: ${DEMO_PRODUCT_SEED_ENABLED:false}
    # 각 시연 상품에 처음 한 번 생성할 실제 product_item 수량.
    # 재기동할 때 SOLD 재고를 다시 채우지는 않는다.
    stock-per-product: ${DEMO_PRODUCT_STOCK_PER_PRODUCT:10}
  geocoding:
    kakao:
      # 주소를 WGS84 좌표로 변환할 카카오 REST API 키. 키가 없으면
      # 좌표 없는 새 업체가 저장되지 않도록 업체 가입·주소 변경을 거절한다.
      rest-api-key: ${KAKAO_REST_API_KEY:}
      base-url: ${KAKAO_GEOCODING_BASE_URL:https://dapi.kakao.com}
      # 기존 company_profile의 NULL 좌표를 기동 시 보완할 때만 임시로 true.
      backfill-enabled: ${COMPANY_GEOLOCATION_BACKFILL_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:upcycle}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
  payment:
    kakaopay:
      # 시크릿이 비어 있으면 MockPaymentGateway 가 붙는다. 실제 청구가 일어나지 않으며
      # 시작 로그에 경고가 남는다. 키를 저장소에 적지 않는다 — 환경변수로만 받는다.
      secret-key: ${KAKAOPAY_SECRET_KEY:}
      # 테스트 가맹점 코드. 실제 가맹점을 받으면 이 값을 바꾼다.
      cid: ${KAKAOPAY_CID:TC0ONETIME}
      base-url: ${KAKAOPAY_BASE_URL:https://open-api.kakaopay.com}
      # 결제창에서 돌아올 프론트 주소. {tradeId} 는 거래별로 치환된다.
      return-url: ${KAKAOPAY_RETURN_URL:http://localhost:5173/trades/{tradeId}/payment/return}
      # 가공비 결제는 거래 결제와 승인 API가 다르므로 별도의 복귀 화면을 사용한다.
      processing-return-url: ${KAKAOPAY_PROCESSING_RETURN_URL:http://localhost:5173/processing/jobs/{jobId}/payment/callback}
      # 제품 주문(소비자)의 복귀 주소. 소비자는 거래 상세 화면을 열 수 없어 라우트가 다르다.
      #
      # 비워 두면 위 return-url 에서 도메인과 basename(예: /test)을 가져와
      # /orders/{orderId}/payment/return 을 만든다. 배포가 이 변수를 따로 넘기지 않아도
      # 동작하게 하려는 것이다 — 상수 기본값(localhost)으로 조용히 떨어지면 카카오페이가
      # approval_url 을 거부해 결제가 통째로 실패하고, 화면에는 "결제 처리 중 오류" 만 뜬다.
      product-order-return-url: ${KAKAOPAY_PRODUCT_ORDER_RETURN_URL:}
  qr:
    # QR 이 담을 Passport 주소. 뒤에 /{qrToken} 이 붙는다.
    #
    # ⚠️ 프론트의 Passport 라우트와 반드시 같아야 한다. 어긋나면 인쇄되어 제품에 붙어 나간
    #    QR 이 전부 죽는데, 그건 되돌릴 수 없다 — 그래서 비어 있으면 기동을 실패시킨다.
    #
    #    현재 그 라우트는 /qr/:qrToken 이므로 배포값은 https://<배포도메인>/qr 이다.
    #    (백엔드의 공개 조회 경로 /api/v1/qr/{qrToken} 과는 다른 것이다 — 이 값은 사람이
    #     브라우저로 여는 화면 주소이지 API 주소가 아니다.)
    base-url: ${QR_BASE_URL:}
  blockchain:
    # 배포된 컨트랙트 좌표. 정본은 blockchain/deployments/ssafy.json 이다.
    #
    # 비어 있으면 온체인 기록 엔드포인트가 501 BLOCKCHAIN_NOT_CONFIGURED 로 거절한다.
    # 빈 주소로 기록을 받으면 나중에 그것이 어느 배포분이었는지 알 수 없다.
    #
    # ⚠️ 프론트의 VITE_*_CONTRACT_ADDRESS 와 같은 배포분이어야 한다 —
    #    어긋나면 화면은 새 컨트랙트에 서명하는데 서버는 옛 주소로 기록한다.
    chain-id: ${BESU_CHAIN_ID:31221}
    material-token-address: ${MATERIAL_TOKEN_ADDRESS:}
    marketplace-address: ${MARKETPLACE_ADDRESS:}
    # 생산 배치 기록용 레지스트리. 이 주소만 비어 있어도 소재·거래 기록은 계속 동작한다 —
    # 나중에 붙는 컨트랙트가 앞선 기능을 멈추게 하지 않는다.
    production-registry-address: ${PRODUCTION_REGISTRY_ADDRESS:}
  material:
    # 소재 최초 발행을 어디가 정본으로 하는가.
    #
    # false(기본) — OffChainMaterialIssuer. 등록 트랜잭션에서 material_balance 를 만든다.
    # true        — 온체인 mint 를 정본으로 하는 구현이 붙을 자리. 아직 없다.
    #
    # 프로파일이 아니라 명시적 설정으로 고른다 (payment.kakaopay 와 같은 이유) —
    # "운영인데 설정이 빠져 조용히 오프체인으로 돌았다" 가 가장 나쁘다.
    on-chain: ${MATERIAL_ON_CHAIN:false}
  auth:
    refresh-token:
      # Access Token은 짧게 유지하고 이 기간 동안 재발급해 사용자의 로그인 상태를 연장한다.
      ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
      # 운영에서는 HTTPS에서만 전송한다. HTTP 로컬 개발만 명시적으로 false로 덮어쓴다.
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
    wallet:
      # 지갑 서명용 1회용 nonce 유효 시간. 사용자가 MetaMask 팝업을 확인하는 데 걸리는
      # 시간보다 넉넉하되, 탈취된 nonce 가 살아 있는 창은 짧아야 한다.
      nonce-ttl: ${WALLET_NONCE_TTL:PT5M}
